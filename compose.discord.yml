services:
  postgres:
    image: postgres:16-alpine
    profiles: [discord]
    environment:
      POSTGRES_DB: bot
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d bot"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: [discord]
    env_file:
      - .env.docker
      - ${SHARED_ENV_FILE:-.env.local}
      - ${BOT_ENV_FILE:-.env.local}
    environment:
      DATABASE_URL: postgresql+asyncpg://bot:bot@postgres:5432/bot
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uv", "run", "--frozen", "--no-dev", "alembic", "upgrade", "head"]

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: [discord]
    env_file:
      - .env.docker
      - ${SHARED_ENV_FILE:-.env.local}
      - ${BOT_ENV_FILE:-.env.local}
    environment:
      DATABASE_URL: postgresql+asyncpg://bot:bot@postgres:5432/bot
      MEMORY_ROOT: /app/memory
    volumes:
      - profiles-users:/app/memory/profiles/users
      - timeline:/app/memory/timeline
      - entities:/app/memory/entities
    command: ["uv", "run", "--frozen", "--no-dev", "start-bot"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: [discord]
    env_file:
      - .env.docker
      - ${SHARED_ENV_FILE:-.env.local}
      - ${BOT_ENV_FILE:-.env.local}
    environment:
      DATABASE_URL: postgresql+asyncpg://bot:bot@postgres:5432/bot
      MEMORY_ROOT: /app/memory
    volumes:
      - profiles-users:/app/memory/profiles/users
      - timeline:/app/memory/timeline
      - entities:/app/memory/entities
    command: ["uv", "run", "--frozen", "--no-dev", "start-worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  profiles-users:
  timeline:
  entities:
